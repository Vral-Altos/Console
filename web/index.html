<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- No viewport-fit=cover: iOS keeps the installed app clear of the notch and home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vral Altos Console: agents, projects and the running system.">
  <meta name="theme-color" content="#080F19">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vral Altos">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vral Altos Console</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter paints its first frame, in the VA colours (one dark theme). */
    html, body { margin: 0; height: 100%; background: #080F19; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease; }
    #splash .mark { width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center;
      justify-content: center; color: #F1FAEE; font: 800 18px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: .5px; background: linear-gradient(135deg, #C7003F, #A80035);
      animation: breathe 1.4s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: .55; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading the Vral Altos Console"><div class="mark">VA</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
